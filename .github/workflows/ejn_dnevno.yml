name: Odprta naročila z ejn.gov.si (dnevno)
on:
  workflow_dispatch:
    inputs:
      lo:
        description: "Najnižji zadevaId (samo za prvi zagon)"
        default: "77500"
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: write
concurrency:
  group: ejn-dnevno
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Pregled ejn.gov.si
        run: python scripts/scan_ejn.py --lo "${{ inputs.lo || '77500' }}"
      - name: Zgradi iskalnik
        run: python scripts/build_iskalnik.py
      - name: Shrani spremembe
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/ejn_state.json docs/iskalnik.html
          git diff --cached --quiet || git commit -m "Osvežitev odprtih naročil z ejn.gov.si"
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Pripravi mapo za nalaganje
        run: mkdir -p deploy && cp docs/iskalnik.html deploy/iskalnik.html
      - name: Naloži na dobra-praksa.si (FTPS, curl)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Strežnik ne pošlje vmesnega certifikata: prenesemo ga z naslova v certifikatu in preverjamo verigo do korenskega CA.
          echo | openssl s_client -connect "$FTP_SERVER:6021" -starttls ftp -servername "$FTP_SERVER" > leaf.txt 2>/dev/null || true
          openssl x509 -in leaf.txt -out leaf.pem
          AIA=$(openssl x509 -in leaf.pem -noout -ext authorityInfoAccess | grep -o 'http[^ ]*' | head -1)
          curl -sS --fail "$AIA" -o inter.bin
          (openssl x509 -inform DER -in inter.bin -out inter.pem 2>/dev/null || openssl x509 -in inter.bin -out inter.pem)
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          curl --fail --show-error --ssl-reqd --tlsv1.2 --tls-max 1.2 --ftp-pasv --disable-epsv \
            --cacert bundle.pem --connect-timeout 30 --max-time 180 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T deploy/iskalnik.html "ftp://$FTP_SERVER:6021/iskalnik.html"
