name: Poskusni prenos z ejn.gov.si
on:
  workflow_dispatch:
    inputs:
      od:
        description: "Prvi zadevaId"
        default: "80300"
      do:
        description: "Zadnji zadevaId"
        default: "80330"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_ejn.py ${{ inputs.od }} ${{ inputs.do }} --out cache_ejn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ejn-html
          path: cache_ejn
      - name: Shrani HTML na vejo ejn-data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ejn-data
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f cache_ejn
          git commit -m "Prenos z ejn.gov.si" > /dev/null
          git push -f origin ejn-data
