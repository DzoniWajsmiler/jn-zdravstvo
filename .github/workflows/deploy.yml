name: Nalaganje iskalnika na dobra-praksa.si (FTPS)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["docs/iskalnik.html"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pripravi mapo samo z iskalnikom
        run: mkdir deploy && cp docs/iskalnik.html deploy/iskalnik.html
      - name: Naloži na dobra-praksa.si (FTPS, curl)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Strežnik ne pošlje vmesnega certifikata: prenesemo ga z naslova v certifikatu in preverjamo verigo do korenskega CA.
          echo | openssl s_client -connect "$FTP_SERVER:6021" -starttls ftp -servername "$FTP_SERVER" > leaf.txt 2>/dev/null || true
          openssl x509 -in leaf.txt -out leaf.pem
          AIA=$(openssl x509 -in leaf.pem -noout -ext authorityInfoAccess | grep -o 'http[^ ]*' | head -1)
          curl -sS --fail "$AIA" -o inter.bin
          (openssl x509 -inform DER -in inter.bin -out inter.pem 2>/dev/null || openssl x509 -in inter.bin -out inter.pem)
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          curl --fail --show-error --ssl-reqd --tlsv1.2 --tls-max 1.2 --ftp-pasv --disable-epsv \
            --cacert bundle.pem --connect-timeout 30 --max-time 180 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T deploy/iskalnik.html "ftp://$FTP_SERVER:6021/iskalnik.html"
