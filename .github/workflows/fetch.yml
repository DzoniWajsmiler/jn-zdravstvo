# Rocni zagon: Actions > Prenos obvestil z enarocanje.si > Run workflow
name: Prenos obvestil z enarocanje.si
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Najvec obvestil na del (0 = vsa; za poskus vpisi 5)"
        default: "5"
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas openpyxl
      - run: python scripts/fetch_api.py data/skrinja_cpv33_2021_2025.xlsx --shard ${{ matrix.shard }}/4 --limit ${{ inputs.limit }} --out cache_api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-${{ matrix.shard }}
          path: cache_api/
          if-no-files-found: ignore
